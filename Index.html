<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sterling AI Widget</title>
  <style>
    :root {
      --bg-sky: #e9f3ff;
      --bg-output: #f0f0f0;
      --bg-white: #ffffff;
      --btn-blue: #2f6fd6;
      --btn-blue-dark: #234f9c;
      --text-dark: #222222;
      --text-light: #f5f5f5;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-sky);
      color: var(--text-dark);
    }

    .app {
      max-width: 800px;
      margin: 0 auto;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .mode-label {
      font-weight: 600;
      margin-right: 4px;
    }

    .mode-box {
      min-width: 120px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #cccccc;
      background-color: var(--bg-white);
      color: var(--text-dark);
      font-size: 14px;
      box-shadow: none;
      pointer-events: none;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border-radius: 6px;
      border: 1px solid #cccccc;
      font-size: 14px;
      padding: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }

    #prompt {
      background-color: var(--bg-white);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    #output {
      background-color: var(--bg-output);
      box-shadow: none;
    }

    .button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: var(--btn-blue);
      color: var(--text-light);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow:
        0 3px 0 var(--btn-blue-dark),
        0 6px 12px rgba(0, 0, 0, 0.25);
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
      user-select: none;
    }

    .button:active {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 var(--btn-blue-dark),
        0 3px 6px rgba(0, 0, 0, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow:
        0 2px 0 var(--btn-blue-dark),
        0 4px 8px rgba(0, 0, 0, 0.15);
    }

    .spacer {
      flex: 1;
    }

    .small-note {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
    }

    /* ⭐ Enhanced Dark Mode */
    .dark-mode body,
    .dark-mode .app {
      background-color: #1e1e1e;
      color: #f5f5f5;
    }

    .dark-mode #prompt {
      background-color: #2b2b2b;
      border-color: #555555;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      color: #f5f5f5;
    }

    .dark-mode #output {
      background-color: #333333;
      border-color: #555555;
      color: #f5f5f5;
      box-shadow: none;
    }

    .dark-mode .mode-box {
      background-color: #2b2b2b;
      border-color: #555555;
      color: #f5f5f5;
      box-shadow: none;
    }

    .dark-mode .button {
      background: #3b7cff;
      box-shadow:
        0 3px 0 #244ba3,
        0 6px 12px rgba(0, 0, 0, 0.6);
      color: #f5f5f5;
    }

    .dark-mode .button:active {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #244ba3,
        0 3px 6px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- ⭐ ROW 1: Type, Mode Box, Clear, Paste -->
    <div class="row">
      <span class="mode-label">Type:</span>
      <button id="typeButton" class="button">Type</button>
      <div id="modeBox" class="mode-box">Start here</div>
      <button id="clearButton" class="button">Clear</button>
      <button id="pasteButton" class="button">Paste</button>
    </div>

    <!-- ⭐ ROW 2: Prompt textarea -->
    <div class="row">
      <textarea id="prompt" placeholder="Enter your prompt here..."></textarea>
    </div>

    <!-- ⭐ ROW 3: Output textarea -->
    <div class="row">
      <textarea id="output" readonly placeholder="Output will appear here..."></textarea>
    </div>

    <!-- ⭐ ROW 4: Copy, Dark Mode, Voice -->
    <div class="row">
      <button id="copyButton" class="button">Copy</button>
      <button id="darkModeButton" class="button">Dark Mode</button>
      <button id="voiceButton" class="button">Voice</button>
      <div class="spacer"></div>
    </div>

    <div class="small-note">
      Modes: Start here, Instructions, Explain, Summary, Creative, AI, History (cycled via Type).
    </div>
  </div>

  <script>
    // ⭐ Mode system
    const modes = [
      "Start here",
      "Instructions",
      "Explain",
      "Summary",
      "Creative",
      "AI",
      "History"
    ];

    let currentModeIndex = 0;
    let history = [];

    const typeButton = document.getElementById("typeButton");
    const modeBox = document.getElementById("modeBox");
    const clearButton = document.getElementById("clearButton");
    const pasteButton = document.getElementById("pasteButton");
    const copyButton = document.getElementById("copyButton");
    const darkModeButton = document.getElementById("darkModeButton");
    const voiceButton = document.getElementById("voiceButton");
    const promptEl = document.getElementById("prompt");
    const outputEl = document.getElementById("output");

    // ⭐ Permission state
    const permissionState = {
      clipboardReadGranted: false,
      clipboardWriteGranted: false,
      micGranted: false
    };

    function loadPermissionState() {
      try {
        const stored = JSON.parse(localStorage.getItem("sterling_permissions") || "{}");
        permissionState.clipboardReadGranted = !!stored.clipboardReadGranted;
        permissionState.clipboardWriteGranted = !!stored.clipboardWriteGranted;
        permissionState.micGranted = !!stored.micGranted;
      } catch (e) {}
    }

    function savePermissionState() {
      try {
        localStorage.setItem("sterling_permissions", JSON.stringify(permissionState));
      } catch (e) {}
    }

    loadPermissionState();

    // ⭐ Mode cycling
    function updateModeBox() {
      modeBox.textContent = modes[currentModeIndex];
    }

    typeButton.addEventListener("click", () => {
      currentModeIndex = (currentModeIndex + 1) % modes.length;
      updateModeBox();
    });

    updateModeBox();

    // ⭐ Clear
    clearButton.addEventListener("click", () => {
      promptEl.value = "";
      outputEl.value = "";
      history = [];
    });

    // ⭐ Paste
    pasteButton.addEventListener("click", async () => {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        alert("Clipboard read is not available.");
        return;
      }

      try {
        const text = await navigator.clipboard.readText();
        permissionState.clipboardReadGranted = true;
        savePermissionState();
        promptEl.value = text;
      } catch (err) {
        alert("Unable to read clipboard. Please allow clipboard access.");
      }
    });

    // ⭐ Copy
    copyButton.addEventListener("click", async () => {
      const text = outputEl.value || "";
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        alert("Clipboard write is not available.");
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        permissionState.clipboardWriteGranted = true;
        savePermissionState();
      } catch (err) {
        alert("Unable to write to clipboard. Please allow clipboard access.");
      }
    });

    // ⭐ Dark Mode toggle
    let darkMode = false;
    darkModeButton.addEventListener("click", () => {
      darkMode = !darkMode;
      if (darkMode) {
        document.documentElement.classList.add("dark-mode");
        darkModeButton.textContent = "Light Mode";
      } else {
        document.documentElement.classList.remove("dark-mode");
        darkModeButton.textContent = "Dark Mode";
      }
    });

    // ⭐ Voice (stub)
    voiceButton.addEventListener("click", async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Microphone access not available.");
        return;
      }

      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        permissionState.micGranted = true;
        savePermissionState();
        alert("Voice feature placeholder: microphone permission granted.");
      } catch (err) {
        alert("Microphone access denied.");
      }
    });

    // ⭐ Mode behavior
    promptEl.addEventListener("input", () => {
      const mode = modes[currentModeIndex];
      const text = promptEl.value;

      if (mode === "Summary") {
        outputEl.value = text.length
          ? "Summary mode:\n\n" + text.slice(0, 200)
          : "";
      } else if (mode === "Instructions") {
        outputEl.value = text.length
          ? "Instructions mode:\n\n1. Read input\n2. Think\n3. Respond"
          : "";
      } else if (mode === "Explain") {
        outputEl.value = text.length
          ? "Explain mode:\n\n" + text
          : "";
      } else if (mode === "Creative") {
        outputEl.value = text.length
          ? "Creative mode:\n\nImagine this as a story: " + text
          : "";
      } else if (mode === "AI") {
        outputEl.value = text.length
          ? "AI mode:\n\n" + text
          : "";
      } else if (mode === "History") {
        outputEl.value = history.join("\n---\n");
      } else {
        outputEl.value = text.length
          ? "Start here mode:\n\nYou typed:\n" + text
          : "";
      }

      if (text.length && mode !== "History") {
        history.push(`[${mode}] ${text}`);
      }
    });
  </script>
</body>
</html>
