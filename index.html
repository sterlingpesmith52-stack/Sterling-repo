<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Transforms</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  #container {
    max-width: 600px;
    margin: auto;
  }
  button {
    margin: 5px;
    padding: 10px 15px;
    font-size: 16px;
  }
  #prompt, #response {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    font-size: 16px;
  }
  #response {
    height: 180px;
  }
</style>
</head>

<body>
<div id="container">

  <h2>AI Transforms</h2>

  <!-- MODE BUTTON -->
  <button id="modeButton">Mode: Normal</button>

  <!-- CLEAR BUTTON -->
  <button id="clearButton">Clear</button>

  <!-- PROMPT INPUT -->
  <input id="prompt" placeholder="Enter prompt here">

  <!-- RESPONSE BOX -->
  <textarea id="response" placeholder="Response will appear here"></textarea>

</div>

<script>
  // -------------------------
  // MODE SYSTEM
  // -------------------------

  let mode = "Normal";
  const modes = ["Normal", "Explain", "Short", "Creative", "AI"];

  document.getElementById("modeButton").addEventListener("click", () => {
    const index = modes.indexOf(mode);
    mode = modes[(index + 1) % modes.length];

    document.getElementById("modeButton").innerText = `Mode: ${mode}`;
    runMode(mode);
  });

  // -------------------------
  // MODE LOGIC (RAW OUTPUT)
  // -------------------------

  function runMode(currentMode) {
    const promptText = document.getElementById("prompt").value.trim();
    const responseBox = document.getElementById("response");

    if (!promptText) {
      responseBox.value = "";
      return;
    }

    let result = "";

    // Normal: raw text
    if (currentMode === "Normal") {
      result = promptText;
    }

    // Explain: raw AI-style explanation (no labels)
    if (currentMode === "Explain") {
      result = "Here’s a clearer way to express it: " + promptText;
    }

    // Short: short version (no labels)
    if (currentMode === "Short") {
      result = promptText.split(" ").slice(0, 5).join(" ") + "...";
    }

    // Creative: creative rewrite (no labels)
    if (currentMode === "Creative") {
      result = "A different way to express this: " + promptText;
    }

    // AI: natural interpretation (no labels)
    if (currentMode === "AI") {
      result = promptText + " — interpreted naturally.";
    }

    responseBox.value = result;
  }

  // -------------------------
  // CLEAR BUTTON
  // -------------------------

  document.getElementById("clearButton").addEventListener("click", () => {
    document.getElementById("prompt").value = "";
    document.getElementById("response").value = "";

    mode = "Normal";
    document.getElementById("modeButton").innerText = "Mode: Normal";

    runMode("Normal");
  });
</script>

</body>
</html>
