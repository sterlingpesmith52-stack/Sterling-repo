
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI transforms</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
  }

  #container {
    max-width: 700px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 0 12px rgba(0,0,0,0.15);
  }

  h2 {
    margin-top: 0;
    text-align: center;
  }

  #modeLabel {
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
  }

  #typeRow {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 15px;
  }

  #modeDisplay {
    width: 120px;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #eee;
    text-transform: lowercase;
  }

  #prompt {
    background: #ffffff;
    border: 1px solid #bbb;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.18);
    padding: 10px;
    border-radius: 10px;
    font-size: 16px;
    width: 100%;
    height: 100px; /* fits ~4 rows */
    margin: 20px 0;
    box-sizing: border-box;
    resize: none;
  }

  #output {
    background: #fafafa;
    border: 1px solid #ccc;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    width: 100%;
    height: 180px;
    box-sizing: border-box;
    resize: none;
  }

  #actionRow {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }

  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #0078ff;
    color: white;
    font-size: 15px;
  }

  button:active {
    transform: scale(0.97);
  }
</style>
</head>

<body>
<div id="container">

  <h2>AI transforms</h2>

  <label id="modeLabel">Type:</label>

  <div id="typeRow">
    <button id="typeBtn">Type</button>
    <input id="modeDisplay" type="text" readonly value="type">
    <button id="clearBtn">Clear</button>
    <button id="pasteBtn">Paste</button>
  </div>

  <textarea id="prompt" spellcheck="false" rows="4"></textarea>

  <textarea id="output" spellcheck="false" readonly></textarea>

  <div id="actionRow">
    <button id="copyBtn">Copy</button>
    <button id="voiceBtn">Voice</button>
  </div>

</div>

<script>
  const promptBox = document.getElementById("prompt");
  const outputBox = document.getElementById("output");

  const modes = ["type", "instructions", "explain", "summarize", "creative", "ai"];
  let modeIndex = 0;
  let currentMode = "type";

  function setMode(mode) {
    currentMode = mode;
    document.getElementById("modeDisplay").value = mode;
    document.getElementById("modeLabel").innerText =
      mode.charAt(0).toUpperCase() + mode.slice(1) + ":";
    runTransform();
  }

  document.getElementById("typeBtn").onclick = () => {
    modeIndex = (modeIndex + 1) % modes.length;
    setMode(modes[modeIndex]);
  };

  document.getElementById("clearBtn").onclick = () => {
    promptBox.value = "";
    outputBox.value = "";
  };

  document.getElementById("pasteBtn").onclick = () => {
    navigator.clipboard.readText().then(text => {
      promptBox.value = text;
      runTransform();
    }).catch(err => {
      console.log("Clipboard error:", err);
    });
  };

  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(outputBox.value);
  };

  /* Speech Recognition — created ONCE */
  let recognition;
  if ("webkitSpeechRecognition" in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      promptBox.value = transcript;
      runTransform();
    };

    recognition.onerror = (event) => {
      console.log("Speech recognition error:", event.error);
    };
  }

  document.getElementById("voiceBtn").onclick = () => {
    if (recognition) recognition.start();
  };

  /* Placeholder transforms */
  function instructionsText(t) { return t; }
  function explainText(t) { return t; }
  function summarizeText(t) { return t; }
  function creativeRewrite(t) { return t; }
  function aiText(t) { return t; }

  function runTransform() {
    const input = promptBox.value;

    if (currentMode === "instructions") {
      outputBox.value = instructionsText(input);
    } else if (currentMode === "explain") {
      outputBox.value = explainText(input);
    } else if (currentMode === "summarize") {
      outputBox.value = summarizeText(input);
    } else if (currentMode === "creative") {
      outputBox.value = creativeRewrite(input);
    } else if (currentMode === "ai") {
      outputBox.value = aiText(input);
    } else {
      outputBox.value = input;
    }
  }
</script>

</body>
</html>
