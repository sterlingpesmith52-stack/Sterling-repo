<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sterling AI Widget</title>
  <style>
    :root {
      --bg-sky: #e9f3ff;
      --bg-output: #f0f0f0;
      --bg-white: #ffffff;
      --btn-blue: #2f6fd6;
      --btn-blue-dark: #234f9c;
      --text-dark: #222222;
      --text-light: #f5f5f5;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-sky);
      color: var(--text-dark);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .mode-label {
      font-weight: 600;
      margin-right: 4px;
    }

    .mode-box {
      min-width: 120px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #cccccc;
      background-color: var(--bg-white);
      color: var(--text-dark);
      font-size: 14px;
      box-shadow: none;
      pointer-events: none;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border-radius: 6px;
      border: 1px solid #cccccc;
      font-size: 14px;
      padding: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }

    #prompt {
      background-color: var(--bg-white);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
    }
