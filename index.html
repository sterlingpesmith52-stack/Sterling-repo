
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Transforms</title>

<style>
  body {
  font-family: Arial, sans-serif;
  margin: 20px;
}

#container {
  max-width: 600px;
  margin: auto;
}

/* 3D BUTTONS */
button {
  margin: 5px;
  padding: 10px 15px;
  font-size: 16px;
  border: none;
  border-radius: 6px;

  background: linear-gradient(#f0f0f0, #d0d0d0);
  box-shadow: 0 4px 6px rgba(0,0,0,0.25);

  transition: all 0.15s ease;
}

button:hover {
  box-shadow: 0 6px 10px rgba(0,0,0,0.30);
  transform: translateY(-2px);
}

button:active {
  box-shadow: 0 2px 3px rgba(0,0,0,0.20);
  transform: translateY(1px);
}

/* 3D PROMPT BOX */
#prompt {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  font-size: 16px;

  background: linear-gradient(#ffffff, #f3f3f3);
  border: 1px solid #ccc;
  border-radius: 6px;

  box-shadow:
    inset 0 2px 3px rgba(0,0,0,0.15),
    0 4px 6px rgba(0,0,0,0.20);
}

/* READ-ONLY RESPONSE BOX */
#response {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  font-size: 16px;
  height: 180px;

  background: #f7f7f7;
  border: 1px solid #bbb;
  border-radius: 6px;

  color: #555;
  cursor: not-allowed;

  box-shadow:
    inset 0 2px 4px rgba(0,0,0,0.20),
    0 3px 5px rgba(0,0,0,0.15);
}

</style>
</head>

<body>
<div id="container">

  <h2>AI Widget Demo</h2>

  <!-- MODE BUTTON -->
  <button id="modeButton">Mode: Normal</button>

  <!-- CLEAR BUTTON -->
  <button id="clearButton">Clear</button>

  <!-- PROMPT INPUT -->
  <input id="prompt" placeholder="Enter prompt here">

  <!-- RESPONSE BOX -->
  <textarea id="response" placeholder="Response will appear here"></textarea>
<button id="copyButton">Copy Response</button>
</div>

<script>
  // -------------------------
  // MODE SYSTEM
  // -------------------------

  let mode = "Normal";
  const modes = ["Normal", "Explain", "Short", "Creative", "AI"];

  document.getElementById("modeButton").addEventListener("click", () => {
    const index = modes.indexOf(mode);
    mode = modes[(index + 1) % modes.length];

    document.getElementById("modeButton").innerText = `Mode: ${mode}`;
    runMode(mode);   // AUTO-RUN LOGIC
  });

  // -------------------------
  // MODE LOGIC (REAL TRANSFORMS)
  // -------------------------

  function runMode(currentMode) {
    const promptText = document.getElementById("prompt").value.trim();
    const responseBox = document.getElementById("response");

    if (!promptText) {
      responseBox.value = "";
      return;
    }

    let result = "";

    if (currentMode === "Normal") {
      result = promptText;
    }

    if (currentMode === "Explain") {
      result = "Explanation: " + promptText + " means something important. Here is a clearer version: " +
               promptText + ".";
    }

    if (currentMode === "Short") {
      result = "Short: " + promptText.split(" ").slice(0, 5).join(" ") + "...";
    }

    if (currentMode === "Creative") {
      result = "Creative rewrite: Imagine this idea transformed — " + promptText +
               " — now expressed with color, emotion, and flair.";
    }

    if (currentMode === "AI") {
      result = "AI response: " + promptText + " → This is a natural AI-style interpretation.";
    }

    responseBox.value = result;
  }

  // -------------------------
  // CLEAR BUTTON
  // -------------------------

  document.getElementById("clearButton").addEventListener("click", () => {
    document.getElementById("prompt").value = "";
    document.getElementById("response").value = "";

    mode = "Normal";
    document.getElementById("modeButton").innerText = "Mode: Normal";

    runMode("Normal");
  });
</script>

</body>
</html>
