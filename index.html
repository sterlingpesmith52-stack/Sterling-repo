<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sterling AI Widget</title>

  <style>
    :root {
      --bg-sky: #e9f3ff;
      --bg-output: #f0f0f0;
      --bg-white: #ffffff;
      --btn-blue: #2f6fd6;
      --btn-blue-dark: #234f9c;
      --text-dark: #222222;
      --text-light: #f5f5f5;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-sky);
      color: var(--text-dark);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .mode-label {
      font-weight: 600;
      margin-right: 4px;
    }

    .mode-box {
      min-width: 120px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #cccccc;
      background-color: var(--bg-white);
      color: var(--text-dark);
      font-size: 14px;
      box-shadow: none;
      pointer-events: none;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border-radius: 6px;
      border: 1px solid #cccccc;
      font-size: 14px;
      padding: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }

    #prompt {
      background-color: var(--bg-white);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    #output {
      background-color: var(--bg-output);
      box-shadow: none;
    }

    .button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      background: var(--btn-blue);
      color: var(--text-light);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow:
        0 3px 0 var(--btn-blue-dark),
        0 6px 12px rgba(0, 0, 0, 0.25);
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
      user-select: none;
    }

    .button:active {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 var(--btn-blue-dark),
        0 3px 6px rgba(0, 0, 0, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow:
        0 2px 0 var(--btn-blue-dark),
        0 4px 8px rgba(0, 0, 0, 0.15);
    }

    .spacer {
      flex: 1;
    }

    .small-note {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
    }

    .dark-mode body,
    .dark-mode .app {
      background-color: #1e1e1e;
      color: #f5f5f5;
    }

    .dark-mode #prompt {
      background-color: #2b2b2b;
      border-color: #555555;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      color: #f5f5f5;
    }

    .dark-mode #output {
      background-color: #333333;
      border-color: #555555;
      color: #f5f5f5;
      box-shadow: none;
    }

    .dark-mode .mode-box {
      background-color: #2b2b2b;
      border-color: #555555;
      color: #f5f5f5;
      box-shadow: none;
    }

    .dark-mode .button {
      background: #3b7cff;
      box-shadow:
        0 3px 0 #244ba3,
        0 6px 12px rgba(0, 0, 0, 0.6);
      color: #f5f5f5;
    }

    .dark-mode .button:active {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #244ba3,
        0 3px 6px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
