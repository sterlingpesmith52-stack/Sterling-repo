
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Transforms</title>

<style>
  /* Prevent right-side collapse */
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f2f2f2;
  }

  #container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
    padding-right: 20px; /* ensures right margin never collapses */
    background: #ffffff;
    border-radius: 10px;

    box-shadow:
      0 6px 12px rgba(0,0,0,0.15),
      inset 0 0 0 rgba(0,0,0,0);
  }

  h2 {
    margin-bottom: 15px;
    text-align: center;
  }

  /* 3D BUTTONS */
  button {
    margin: 5px;
    padding: 10px 15px;
    font-size: 16px;
    border: none;
    border-radius: 6px;

    background: linear-gradient(#f0f0f0, #d0d0d0);
    box-shadow: 0 4px 6px rgba(0,0,0,0.25);

    transition: all 0.15s ease;
  }

  button:hover {
    box-shadow: 0 6px 10px rgba(0,0,0,0.30);
    transform: translateY(-2px);
  }

  button:active {
    box-shadow: 0 2px 3px rgba(0,0,0,0.20);
    transform: translateY(1px);
  }

  /* SUNKEN PROMPT BOX */
  #prompt {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    font-size: 16px;

    background: #ffffff;
    border: 1px solid #ccc;
    border-radius: 6px;

    box-shadow:
      inset 3px 3px 6px rgba(0,0,0,0.25),
      inset -3px -3px 6px rgba(255,255,255,0.9);
  }

  /* FLAT READ-ONLY RESPONSE BOX */
  #response {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    font-size: 16px;
    height: 180px;

    background: #f7f7f7;
    border: 1px solid #bbb;
    border-radius: 6px;

    color: #555;
    cursor: not-allowed;

    box-shadow:
      inset 0 0 0 rgba(0,0,0,0),
      0 1px 2px rgba(0,0,0,0.12);
  }
