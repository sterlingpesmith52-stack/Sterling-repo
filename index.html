<!DOCTYPE html><!DOCTYPE html>
<html>
<head>
  <title>AI Transforms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #ffffff;
      color: #000000;
      transition: background 0.3s ease, color 0.3s ease;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #bbb;
      background: #f7f7f7;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
      transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #aaa;
      cursor: pointer;
      background: #e0e0e0;
      transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
    }

    #clearButton {
      background: #fce4e4;
      border: 1px solid #d88;
    }

    #modeDisplay {
      padding: 10px;
      font-size: 16px;
      width: 180px;
      background: #f7f7f7;
      border: 1px solid #bbb;
      border-radius: 6px;
      color: #555;
      cursor: not-allowed;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }

    #copyButton {
      width: 120px;
    }

    #darkModeButton {
      width: 140px;
    }

    #voiceButton {
      width: 120px;
    }

    body.dark {
      background: #1e1e1e;
      color: #e0e0e0;
    }

    body.dark textarea {
      background: #2b2b2b;
      color: #e0e0e0;
      border: 1px solid #555;
    }

    body.dark #modeDisplay {
      background: #2b2b2b;
      color: #e0e0e0;
      border: 1px solid #555;
    }

    body.dark button {
      background: #444;
      color: #eee;
      border: 1px solid #666;
    }

    body.dark #clearButton {
      background: #663;
      color: #eee;
      border: 1px solid #aa7;
    }
  </style>
</head>

<body>

  <h2>AI Transforms</h2>

  <!-- Row One: Type | Mode Display | Clear | Paste -->
  <div class="row">
    <button id="typeButton">Type: Start here</button>
    <input id="modeDisplay" readonly value="Start here">
    <button id="clearButton">Clear</button>
    <button id="pasteButton">Paste</button>
  </div>

  <!-- Prompt -->
  <textarea id="prompt" placeholder="Type something…"></textarea>

  <!-- Response -->
  <textarea id="response" placeholder="Output appears here…" readonly></textarea>

  <!-- Bottom Row: Copy | Dark Mode | Voice -->
  <div class="row">
    <button id="copyButton">Copy</button>
    <button id="darkModeButton">Dark Mode</button>
    <button id="voiceButton">Voice</button>
  </div>

  <script>
    const modes = [
      "Start here",
      "Instructions",
      "Explain",
      "Summarize",
      "Creative",
      "AI"
    ];

    let mode = "Start here";

    function runMode(currentMode) {
      const promptText = document.getElementById("prompt").value;
      let result = "";

      if (currentMode === "Start here") {
        result = promptText;
      }

      if (currentMode === "Instructions") {
        result =
          "AI Transforms converts your text into different styles.\n\n" +
          "Start here — shows your text as-is\n" +
          "Instructions — explains how the widget works\n" +
          "Explain — gives a clearer version of your text\n" +
          "Summarize — produces a short summary\n" +
          "Creative — rewrites with imagination\n" +
          "AI — gives an AI-style interpretation\n\n" +
          "Use Clear to reset everything.\n" +
          "Use Paste to insert clipboard text.\n" +
          "Use Copy to copy the response.\n" +
          "Use Voice to speak text into the prompt.";
      }

      if (currentMode === "Explain") {
        result = "Explanation: " + promptText;
      }

      if (currentMode === "Summarize") {
        const sentences = promptText
          .replace(/\n+/g, " ")
          .split(/(?<=[.!?])\s+/);

        if (sentences.length === 1) {
          result = "Summary: " + promptText;
        } else {
          result = "Summary: " + sentences.slice(0, 2).join(" ");
        }
      }

      if (currentMode === "Creative") {
        result = "Creative: " + promptText;
      }

      if (currentMode === "AI") {
        result = "AI interpretation: " + promptText;
      }

      document.getElementById("response").value = result;
    }

    // Type button cycles modes
    document.getElementById("typeButton").addEventListener("click", () => {
      const index = modes.indexOf(mode);
      mode = modes[(index + 1) % modes.length];

      document.getElementById("typeButton").innerText = `Type: ${mode}`;
      document.getElementById("modeDisplay").value = mode;

      runMode(mode);
    });

    // Clear button
    document.getElementById("clearButton").addEventListener("click", () => {
      document.getElementById("prompt").value = "";
      document.getElementById("response").value = "";

      mode = "Start here";
      document.getElementById("typeButton").innerText = "Type: Start here";
      document.getElementById("modeDisplay").value = "Start here";

      runMode("Start here");
    });

    // Paste button
    document.getElementById("pasteButton").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        const promptEl = document.getElementById("prompt");
        promptEl.value = promptEl.value ? promptEl.value + text : text;
        runMode(mode);
      } catch (err) {
        alert("Clipboard access blocked.");
      }
    });

    // Copy button
    document.getElementById("copyButton").addEventListener("click", async () => {
      const text = document.getElementById("response").value;
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        alert("Unable to copy to clipboard.");
      }
    });

    // Dark Mode toggle
    document.getElementById("darkModeButton").addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const isDark = document.body.classList.contains("dark");
      document.getElementById("darkModeButton").innerText =
        isDark ? "Light Mode" : "Dark Mode";
    });

    // Voice input
    document.getElementById("voiceButton").addEventListener("click", () => {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Voice input not supported in this browser.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        const promptEl = document.getElementById("prompt");
        promptEl.value = promptEl.value ? promptEl.value + " " + spoken : spoken;
        runMode(mode);
      };

      recognition.start();
    });
