
<!DOCTYPE html>
<html>
<head>
  <title>AI Transforms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #ffffff;
      color: #000000;
      transition: background 0.3s ease, color 0.3s ease;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #bbb;
      background: #f7f7f7;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
      transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
    }

    #modeButton, #clearButton {
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #aaa;
      cursor: pointer;
      background: #e0e0e0;
      transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
    }

    #clearButton {
      background: #fce4e4;
      border: 1px solid #d88;
    }

    #modeDisplay {
      margin-left: 10px;
      padding: 8px;
      font-size: 16px;
      width: 180px;
      background: #f7f7f7;
      border: 1px solid #bbb;
      border-radius: 6px;
      color: #555;
      cursor: not-allowed;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
    }

    body.dark {
      background: #1e1e1e;
      color: #e0e0e0;
    }

    body.dark textarea {
      background: #2b2b2b;
      color: #e0e0e0;
      border: 1px solid #555;
    }

    body.dark #modeDisplay {
      background: #2b2b2b;
      color: #e0e0e0;
      border: 1px solid #555;
    }

    body.dark #modeButton {
      background: #444;
      color: #eee;
      border: 1px solid #666;
    }

    body.dark #clearButton {
      background: #663;
      color: #eee;
      border: 1px solid #aa7;
    }

    body.dark #darkModeButton {
      background: #444;
      color: #eee;
      border: 1px solid #666;
    }

    #darkModeButton {
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 6px;
      background: #e0e0e0;
      border: 1px solid #aaa;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
    }
  </style>
</head>

<body>

  <h2>AI Transforms</h2>

  <textarea id="prompt" placeholder="Type something…"></textarea>
  <textarea id="response" placeholder="Output appears here…" readonly></textarea>

  <button id="modeButton">Type: Start here</button>
  <input id="modeDisplay" readonly value="Start here">

  <button id="clearButton">Clear</button>

  <div style="margin-top: 40px; text-align: center;">
    <button id="darkModeButton">Dark Mode</button>
  </div>

  <script>
    const modes = [
      "Start here",
      "Instructions",
      "Paste",
      "Explain",
      "Summarize",
      "Creative",
      "AI"
    ];

    let mode = "Start here";

    function runMode(currentMode) {
      const promptText = document.getElementById("prompt").value;
      let result = "";

      if (currentMode === "Start here") {
        result = promptText;
      }

      if (currentMode === "Instructions") {
        result =
          "AI Transforms converts your text into different styles.\n\n" +
          "Start here — shows your text as-is\n" +
          "Instructions — explains how the widget works\n" +
          "Paste — drop in copied text without changes\n" +
          "Explain — gives a clearer version of your text\n" +
          "Summarize — produces a short summary\n" +
          "Creative — rewrites with imagination\n" +
          "AI — gives an AI-style interpretation\n\n" +
          "Use Clear to reset everything.";
      }

      if (currentMode === "Paste") {
        result = promptText;
      }

      if (currentMode === "Explain") {
        result = "Explanation: " + promptText;
      }

      if (currentMode === "Summarize") {
        const sentences = promptText
          .replace(/\n+/g, " ")
          .split(/(?<=[.!?])\s+/);

        if (sentences.length === 1) {
          result = "Summary: " + promptText;
        } else {
          result = "Summary: " + sentences.slice(0, 2).join(" ");
        }
      }

      if (currentMode === "Creative") {
        result = "Creative: " + promptText;
      }

      if (currentMode === "AI") {
        result = "AI interpretation: " + promptText;
      }

      document.getElementById("response").value = result;
    }

    document.getElementById("modeButton").addEventListener("click", () => {
      const index = modes.indexOf(mode);
      mode = modes[(index + 1) % modes.length];

      document.getElementById("modeButton").innerText = `Type: ${mode}`;
      document.getElementById("modeDisplay").value = mode;

      runMode(mode);
    });

    document.getElementById("clearButton").addEventListener("click", () => {
      document.getElementById("prompt").value = "";
      document.getElementById("response").value = "";

      mode = "Start here";
      document.getElementById("modeButton").innerText = "Type: Start here";
      document.getElementById("modeDisplay").value = "Start here";

      runMode("Start here");
    });

    document.getElementById("darkModeButton").addEventListener("click", () => {
      document.body.classList.toggle("dark");

      const isDark = document.body.classList.contains("dark");
      document.getElementById("darkModeButton").innerText =
        isDark ? "Light Mode" : "Dark Mode";
    });
  </script>

</body>
</html>
