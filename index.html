<body>

    <div class="row">
      <span class="mode-label">Type:</span>
      <button id="typeButton" class="button">Type</button>
      <div id="modeBox" class="mode-box">Start here</div>
      <button id="clearButton" class="button">Clear</button>
      <button id="pasteButton" class="button">Paste</button>
    </div>

    <div class="row">
      <textarea id="prompt" placeholder="Enter your prompt here..."></textarea>
    </div>

    <div class="row">
      <textarea id="output" readonly placeholder="Output will appear here..."></textarea>
    </div>

    <div class="row">
      <button id="copyButton" class="button">Copy</button>
      <button id="darkModeButton" class="button">Dark Mode</button>
      <button id="voiceButton" class="button">Voice</button>
      <div class="spacer"></div>
    </div>

    <div class="small-note">
      Modes: Start here, Instructions, Explain, Summary, Creative, AI, History.
    </div>

    const modes = [
      "Start here",
      "Instructions",
      "Explain",
      "Summary",
      "Creative",
      "AI",
      "History"
    ];

    let currentModeIndex = 0;
    let history = [];

    const typeButton = document.getElementById("typeButton");

    const darkModeButton = document.getElementById("darkModeButton");

      const sentences = text.split(/(?<=[.!?])\s+/);
      return sentences.slice(0, 2).join(" ");
    }

    function explain(text) {
      return "Here’s a plain-language explanation:\n\n" + text;
    }

    function instructions(text) {
      return (
        "Here are simple steps based on what you wrote:\n\n" +
        "1. Identify the main idea.\n" +
        "2. Break it into smaller parts.\n" +
        "3. Handle each part one at a time.\n\n" +
        "Your text:\n" + text
      );
    }

    function creative(text) {
      return (
        "Here’s a playful rewrite:\n\n" +
        "Imagine this as a tiny story:\n" +
        text
      );
    }

    function aiResponse(text) {
      return (
        "AI-style response:\n\n" +
        "You said:\n" + text + "\n\n" +
        "Here’s a thoughtful reply:\n" +
        "This looks like something you're working through."
      );
    }

    function startHere(text) {
      return (
        "Start here mode:\n\n" +
        "You typed:\n" + text + "\n\n" +
        "Try switching modes to see different personalities."
      );
    }

    function runMode() {
      const mode = modes[currentModeIndex];
      const text = promptEl.value.trim();

      if (!text && mode !== "History") {
        outputEl.value = "";
        return;
      }

      let result = "";

      switch (mode) {
        case "Summary":
          result = summarize(text);
          break;
        case "Explain":
          result = explain(text);
          break;
        case "Instructions":
          result = instructions(text);
          break;
        case "Creative":
          result = creative(text);
          break;
        case "AI":
          result = aiResponse(text);
          break;

          break;
